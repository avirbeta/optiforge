plugins {
    id 'fabric-loom' version '1.11.8'
    id 'java'
    id 'maven-publish'
}

base {
    archivesName = 'optiforge'
}

version = '2.0.0-1.21.10'
group = 'com.vizor.optiforge'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.10"
    mappings "net.fabricmc:yarn:1.21.10+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.20.1"

    modImplementation "net.fabricmc.fabric-api:fabric-api:0.138.4+1.21.10"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
